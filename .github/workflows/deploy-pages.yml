name: Deploy Pantry Loop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public browser assets only
        run: |
          mkdir public-site
          cp index.html app.css sw.js manifest.webmanifest .nojekyll public-site/
          cp -R src vendor icons public-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
