<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101612">
    <meta name="description" content="A fast, offline-first personal grocery tracker.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./app.css">
    <title>Pantry Loop</title>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <header class="topbar">
      <div>
        <p class="eyebrow">PANTRY LOOP</p>
        <p id="page-title" class="page-title">Scan</p>
      </div>
      <div class="status-cluster" aria-live="polite">
        <span id="network-status" class="status-chip">Checking connection</span>
        <span id="offline-status" class="status-chip">Offline setup pending</span>
      </div>
    </header>

    <main id="app" tabindex="-1" aria-live="polite">
      <section class="loading-card">
        <span class="spinner" aria-hidden="true"></span>
        <p>Opening your catalogue…</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <a href="#scan" data-route="scan"><span aria-hidden="true">▣</span>Scan</a>
      <a href="#list" data-route="list"><span aria-hidden="true">✓</span>List</a>
      <a href="#catalogue" data-route="catalogue"><span aria-hidden="true">▤</span>Catalogue</a>
      <a href="#settings" data-route="settings"><span aria-hidden="true">⚙</span>Settings</a>
    </nav>

    <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
    <script src="./vendor/idb-8.0.3.umd.js"></script>
    <script src="./vendor/zxing-wasm-reader-3.1.4.js"></script>
    <script src="./vendor/xlsx-0.20.3.full.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
